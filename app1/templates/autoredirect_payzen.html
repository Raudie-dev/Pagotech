{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PagoTech | Redirigiendo a Pago Seguro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.95);
            --accent: #3b82f6;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .redirect-box {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .brand-logo span {
            color: var(--accent);
        }

        .spinner-wrapper {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(59, 130, 246, 0.15);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }

        .spinner-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--accent);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h3 {
            margin: 0 0 10px;
            font-size: 18px;
            font-weight: 600;
        }

        p {
            margin: 0 0 20px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        .info-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 13px;
            color: #d1d5db;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge-card {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .fallback-btn {
            margin-top: 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .fallback-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="brand-logo"><i class="fas fa-shield-alt text-primary me-2"></i>PAGO<span>TECH</span></div>
        
        <div class="spinner-wrapper">
            <div class="spinner"></div>
            <div class="spinner-icon"><i class="fas fa-credit-card"></i></div>
        </div>

        <h3>Redirigiendo a pago seguro</h3>
        <p>Cargando el formulario para ingresar los datos de tu tarjeta en PayZen...</p>

        {% if card_code %}
        <div class="info-pill">
            <span>Tarjeta seleccionada:</span>
            <span class="badge-card">{{ card_code }}</span>
        </div>
        {% endif %}

        <a href="{{ target_url }}" class="fallback-btn" id="manualLink">Si no redirige automáticamente, haz clic aquí</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            window.location.replace("{{ target_url|escapejs }}");
        });
    </script>
</body>
</html>
